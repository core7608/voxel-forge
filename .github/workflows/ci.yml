name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]

jobs:
  test:
    name: Import + Smoke Test (Godot 4.4 headless)
    runs-on: ubuntu-latest
    container: godot-ci/godot:4.4-stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import assets (headless editor pass)
        run: godot --headless --import

      - name: Run smoke tests
        run: godot --headless scenes/smoke_test.tscn

      - name: Boot check (main scene ~4s)
        run: godot --headless --quit-after 400

